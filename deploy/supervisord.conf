# ── Supervisord config — runs nginx + uvicorn in a single container ───────────
# Used by the Hugging Face Spaces Dockerfile (deploy/Dockerfile → root Dockerfile).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# ── FastAPI / uvicorn ─────────────────────────────────────────────────────────
[program:uvicorn]
command=uvicorn src.web_app.server:app
        --host 127.0.0.1
        --port 8000
        --workers 1
directory=/app
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# ── Nginx (serves React + proxies /api/ to uvicorn) ──────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
